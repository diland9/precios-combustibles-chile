name: Snapshot diario de precios de combustibles

on:
  schedule:
    # 13:00 UTC ≈ 09:00-10:00 hora Chile (según horario de verano/invierno)
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar y procesar precios de hoy
        run: node scripts/fetch_snapshot.js

      - name: Regenerar el buscador (docs/index.html)
        run: node scripts/build_site.js

      - name: Commit y push de los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Sin cambios, no se crea commit."
          else
            git commit -m "Snapshot $(date -u +%F)"
            git push
          fi
